---
layout: default
---
<h1 class="go-center">{{ site.title }}</h1>
<h2 class="flush go-center">{{ site.description }}</h2>

<div class="post-body">
  {{ content | replace: "<ul>", '<ul class="lcars-list">' }}
</div>

<h2>Missions</h2>
{% include entry-rows.html items=site.projects %}

<h2>Latest logs</h2>
{% include entry-rows.html items=site.posts limit=5 %}

<div class="buttons justify-center">
  <button onclick="playSoundAndRedirect('audio2', '{{ "/projects/" | relative_url }}')">missions</button>
  <button onclick="playSoundAndRedirect('audio2', '{{ "/logs/" | relative_url }}')" class="button-light-orange-red">all logs</button>
</div>
