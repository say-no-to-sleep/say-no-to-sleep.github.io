---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="uppercase go-right">
    {{ page.date | date: "%Y-%m-%d" }}{% if page.project %} · {{ page.project }}{% endif %}
  </p>
  {%- comment -%} Markdown bullet lists get the LCARS oval bullets. {%- endcomment -%}
  <div class="post-body">
    {{ content | replace: "<ul>", '<ul class="lcars-list">' }}
  </div>
  <p><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>
