# Pages CMS config (https://pagescms.org): browser editor for the site.
media:
  input: assets
  output: /assets
content:
  - name: posts
    label: Logs
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, project]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: project
        label: Project
        type: reference
        options:
          collection: projects
          value: "{path}"
          label: "{title}"
      - name: unlisted
        label: Unlisted (reachable only by typing its ID on the keypad)
        type: boolean
      - name: code
        label: Page ID override (xx-xxxx, normally automatic)
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown

  - name: projects
    label: Missions
    type: collection
    path: _projects
    filename: "{primary}.md"
    view:
      fields: [title, dates, order]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: dates
        label: Dates
        type: string
      - name: details
        label: Details (tech, location)
        type: string
      - name: summary
        label: Summary (shown in lists)
        type: text
      - name: order
        label: Order (1 = top of list)
        type: number
      - name: unlisted
        label: Unlisted (reachable only by typing its ID on the keypad)
        type: boolean
      - name: code
        label: Page ID override (xx-xxxx, normally automatic)
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown

  - name: home
    label: Home page
    type: file
    path: index.md
    fields:
      - name: layout
        type: string
        hidden: true
      - name: unlisted
        label: Unlisted (reachable only by typing its ID on the keypad)
        type: boolean
      - name: code
        label: Page ID override (xx-xxxx, normally automatic)
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
