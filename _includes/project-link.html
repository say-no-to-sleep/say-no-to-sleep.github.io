{%- comment -%} Link to the project a post belongs to. Posts store the project file path, e.g. project: _projects/resistor-sorter.md {%- endcomment -%}
{%- assign linked = site.projects | where: "path", include.path | first -%}
{%- if linked %} · <a href="{{ linked.url | relative_url }}">{{ linked.title }}</a>{% endif -%}
