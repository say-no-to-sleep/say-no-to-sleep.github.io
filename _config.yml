title: Jinyuan (Eugene) Zhao
description: Portfolio and project log
url: https://say-no-to-sleep.github.io
markdown: kramdown
permalink: /logs/:year/:month/:day/:title/
exclude:
  - legacy
  - docs
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: entry
